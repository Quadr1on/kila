[project]
name = "kila"
version = "0.1.0"
description = "KILA — sovereign, air-gapped agentic AI workbench (SIH26117 MVP)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "filetype>=1.2",
    "cryptography>=43",
    "pyyaml>=6.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "opencv-python>=4.10",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "reportlab>=4.2",
]
setup = [
    "huggingface-hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kila"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
