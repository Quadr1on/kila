# KILA stack. Build while online (`make setup && docker compose build`), then run offline.
#
# Networking (spec §7):
#   kila_internal  internal: true  -> containers can reach each other, nothing can reach out.
#   kila_edge      normal bridge   -> exists ONLY so the web UI port can be published to the host.
# Docker does not publish ports for containers that are only on an internal network, so `web`
# is dual-homed. `api` (and later qdrant, ollama, sandbox runners) are internal-only; the egress
# self-test runs from `api`. See docs/ARCHITECTURE.md "Isolation boundary".
name: kila

services:
  api:
    build: { context: services/api }
    image: kila/api:dev
    environment:
      KILA_DATA_DIR: /data
      KILA_CONFIG_DIR: /app/config
      KILA_SECRET_KEY: ${KILA_SECRET_KEY:?set KILA_SECRET_KEY in .env}
      KILA_SEED_PASSWORD: ${KILA_SEED_PASSWORD:-kila-demo}
      KILA_COOKIE_SECURE: ${KILA_COOKIE_SECURE:-false}
      KILA_OLLAMA_URL: http://ollama:11434
      KILA_METRICS_DIR: /metrics
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./metrics:/metrics
      - ./models:/app/models:ro          # bge-m3, reranker, OCR models from scripts/predownload.py
      - ./seed:/app/seed:ro              # synthetic demo corpus (Knowledge base -> Load demo corpus)
    networks: [kila_internal]
    depends_on: [ollama]
    restart: unless-stopped

  # Model server. Internal network only, so it cannot pull at runtime: models must already be
  # in OLLAMA_MODELS_DIR (run scripts/predownload.py --yes against a host Ollama first, then
  # point OLLAMA_MODELS_DIR at that store, e.g. %USERPROFILE%/.ollama/models on Windows).
  ollama:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}   # laptop profile: one resident model
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${OLLAMA_MODELS_DIR:-./models/ollama}:/root/.ollama/models
    networks: [kila_internal]
    gpus: all
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args: { KILA_API_URL: "http://api:8000" }
    image: kila/web:dev
    environment:
      KILA_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "${KILA_BIND:-127.0.0.1}:3000:3000"
    networks: [kila_internal, kila_edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

networks:
  kila_internal:
    internal: true
  kila_edge: {}
